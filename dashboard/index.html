<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071018" />
  <meta name="description" content="Ensemble weather forecast with per-source comparison" />
  <title>Weather</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Outfit:wght@380;500;640&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #071018;
      --ink: #f4f7fb;
      --muted: #93a4b5;
      --line: rgba(255,255,255,0.08);
      --card: rgba(12, 24, 36, 0.72);
      --accent: #8ee7ff;
      --warm: #ffb086;
      --good: #8ee0b0;
      --warn: #f0c36a;
      --bad: #ff8d8d;
      --shadow: 0 20px 50px rgba(0,0,0,0.28);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 520px at 10% -10%, rgba(142,231,255,0.18), transparent 55%),
        radial-gradient(800px 480px at 110% 0%, rgba(255,176,134,0.12), transparent 50%),
        var(--bg);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    a { color: var(--accent); }
    .wrap { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 18px 0 48px; }
    header.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand strong { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .search { position: relative; flex: 1; max-width: 460px; }
    @media (max-width: 700px) {
      header.top { flex-direction: column; }
      .search { max-width: none; width: 100%; }
    }
    .search form { display: flex; gap: 8px; }
    .search input, .icon-btn, .chip, .suggest button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
    }
    .search input { flex: 1; padding: 12px 16px; min-height: 44px; }
    .icon-btn { min-height: 44px; padding: 0 14px; background: rgba(142,231,255,0.12); border-color: transparent; }
    .suggest {
      position: absolute; z-index: 5; left: 0; right: 0; top: 50px;
      background: #10202d; border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; box-shadow: var(--shadow);
    }
    .suggest button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 12px 14px; min-height: 44px; background: transparent; }
    .suggest button:hover { background: rgba(255,255,255,0.05); }
    .suggest small { color: var(--muted); }
    .layout { display: grid; gap: 16px; margin-top: 16px; }
    @media (min-width: 960px) {
      .layout { grid-template-columns: 1.35fr 0.9fr; align-items: start; }
      .stack { display: grid; gap: 16px; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }
    .hero { min-height: 240px; position: relative; overflow: hidden; }
    .hero h1 { font-family: "Fraunces", Georgia, serif; font-size: clamp(76px, 12vw, 112px); line-height: 0.85; margin: 8px 0 0; font-weight: 500; letter-spacing: -0.04em; }
    .place { font-size: 28px; margin: 0; }
    .meta { color: var(--muted); margin: 6px 0 0; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .pill { background: rgba(255,255,255,0.06); border-radius: 999px; padding: 8px 12px; font-size: 14px; }
    .confidence { font-weight: 640; }
    .confidence.HIGH { color: var(--good); }
    .confidence.MODERATE { color: var(--warn); }
    .confidence.LOW { color: var(--bad); }
    .strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
    .hour {
      scroll-snap-align: start; min-width: 72px; text-align: center; padding: 10px 6px;
      border-radius: 16px; background: rgba(255,255,255,0.03);
    }
    .hour b { display: block; font-size: 16px; margin-top: 6px; }
    .hour span, .day-row .cond { color: var(--muted); font-size: 12px; }
    .day-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
    .bar { position: relative; height: 6px; border-radius: 99px; background: rgba(255,255,255,0.08); }
    .bar i { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, #7dd3fc, #fb923c); }
    .temps { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .temps em { color: var(--muted); font-style: normal; margin-right: 8px; }
    .sources { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip { padding: 8px 12px; min-height: 40px; white-space: nowrap; }
    .chip[aria-pressed="true"] { background: var(--ink); color: #071018; border-color: transparent; }
    .chart-box { position: relative; height: 240px; }
    .status { color: var(--muted); font-size: 13px; }
    .error { color: var(--bad); }
    .skeleton { height: 18px; border-radius: 8px; background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.1), rgba(255,255,255,0.04)); background-size: 200% 100%; animation: shine 1.2s infinite; }
    @keyframes shine { to { background-position: -200% 0; } }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    footer { color: var(--muted); font-size: 13px; margin-top: 18px; }
    .hidden { display: none; }
    h2 { font-size: 16px; margin: 0 0 12px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <strong>Ensemble</strong>
      </div>
      <div class="search">
        <form id="search-form" role="search">
          <input id="q" name="q" type="search" placeholder="Search a city" aria-label="Search for a place" autocomplete="off" />
          <button class="icon-btn" id="geo" type="button" aria-label="Use my location">Locate</button>
        </form>
        <div id="suggest" class="suggest hidden" role="listbox"></div>
      </div>
    </header>

    <p id="banner" class="status" role="status">Loading Bratislava…</p>

    <div class="layout">
      <div class="stack">
        <section class="card hero" id="hero" aria-live="polite">
          <p class="place" id="place">—</p>
          <p class="meta" id="summary">Current conditions</p>
          <h1 id="temp">--°</h1>
          <div class="pills" id="pills"></div>
        </section>
        <section class="card">
          <h2>Hourly</h2>
          <div class="strip" id="hourly"></div>
        </section>
        <section class="card">
          <h2>10 days</h2>
          <div id="daily"></div>
        </section>
      </div>
      <div class="stack">
        <section class="card">
          <h2>Compare sources</h2>
          <div class="sources" id="sources" role="group" aria-label="Forecast source"></div>
          <p class="status" id="source-note"></p>
        </section>
        <section class="card">
          <h2>Temperature, next 48 hours</h2>
          <div class="chart-box"><canvas id="chart" aria-label="Hourly temperature chart"></canvas></div>
        </section>
        <section class="card" id="accuracy-card">
          <h2>Recent accuracy, Bratislava</h2>
          <div id="accuracy"><p class="status">Scores load from the latest backtest.</p></div>
        </section>
      </div>
    </div>
    <footer id="footer">
      Forecasts blend the live sources. SHMÚ ALADIN is included over Slovakia.
      <a href="/legacy">Classic dashboard</a>
    </footer>
  </div>
  <script>
    const state = { forecast: null, source: "ensemble", chart: null, suggest: [] };

    const $ = (id) => document.getElementById(id);

    function paramsFromLocation() {
      const q = new URLSearchParams(location.search);
      if (q.get("lat") && q.get("lon")) return { lat: q.get("lat"), lon: q.get("lon") };
      if (q.get("place")) return { place: q.get("place") };
      try {
        const saved = JSON.parse(localStorage.getItem("weather-place") || "null");
        if (saved && saved.lat != null) return { lat: saved.lat, lon: saved.lon };
      } catch (err) { /* ignore broken storage */ }
      return { lat: 48.15, lon: 17.11 };
    }

    function remember(lat, lon, name) {
      const url = new URL(location.href);
      url.search = `?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
      history.replaceState(null, "", url);
      localStorage.setItem("weather-place", JSON.stringify({ lat, lon, name }));
    }

    async function loadForecast(query) {
      $("banner").textContent = "Fetching sources… the first Slovak request also reads the SHMÚ model.";
      $("banner").classList.remove("error");
      const url = new URL("/api/v1/forecast", location.origin);
      Object.entries(query).forEach(([k, v]) => url.searchParams.set(k, v));
      url.searchParams.set("days", "10");
      let response;
      try {
        response = await fetch(url);
      } catch (err) {
        $("banner").textContent = "The forecast service is unreachable.";
        $("banner").classList.add("error");
        return;
      }
      const body = await response.json();
      if (!response.ok) {
        $("banner").textContent = body.error || "Forecast failed.";
        $("banner").classList.add("error");
        return;
      }
      state.forecast = body;
      state.source = "ensemble";
      const loc = body.location || {};
      remember(loc.latitude, loc.longitude, loc.name);
      render();
      const failed = (body.sources || []).filter((s) => s.status !== "ok").map((s) => s.id);
      const when = body.generated_at ? new Date(body.generated_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
      $("banner").textContent = failed.length
        ? `Updated ${when}. Unavailable: ${failed.join(", ")}.`
        : `Updated ${when}. All requested sources responded.`;
    }

    function pick(block, field) {
      if (!block) return null;
      if (state.source === "ensemble") return block.ensemble ? block.ensemble[field] : block[field];
      const src = (block.sources || {})[state.source];
      if (!src || src[field] == null) return null;
      return src[field];
    }

    const CONDITION_LABELS = {
      clear: "Clear",
      partly_cloudy: "Partly cloudy",
      cloudy: "Cloudy",
      rain: "Rain",
      heavy_rain: "Heavy rain",
      drizzle: "Drizzle",
      snow: "Snow",
      thunderstorm: "Thunderstorm",
      fog: "Fog",
      unknown: "Unknown",
    };

    function prettyCondition(value) {
      if (!value) return "";
      return CONDITION_LABELS[value] || value;
    }

    function fmt(value, suffix) {
      if (value == null || Number.isNaN(Number(value))) return "—";
      const n = Math.round(Number(value));
      return suffix ? `${n}${suffix}` : String(n);
    }

    function hourLabel(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso.slice(11, 16);
      return d.toLocaleTimeString([], { hour: "numeric" });
    }

    function dayLabel(iso) {
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString([], { weekday: "short" });
    }

    function render() {
      const data = state.forecast;
      if (!data) return;
      const loc = data.location || {};
      const current = data.current || {};
      $("place").textContent = [loc.name, loc.country].filter(Boolean).join(", ");
      const cond = prettyCondition(pick(current, "condition") || current.condition || "Forecast");
      $("summary").textContent = cond;
      $("temp").textContent = fmt(pick(current, "temperature_c") ?? current.temperature_c, "°");
      const feels = pick(current, "feels_like_c") ?? current.feels_like_c;
      const conf = current.confidence || {};
      const obs = current.sources && current.sources["SHMU-OBS"];
      $("pills").innerHTML = [
        pill("Feels", fmt(feels, "°")),
        pill("Humidity", fmt(pick(current, "humidity_pct") ?? current.humidity_pct, "%")),
        pill("Wind", fmt(pick(current, "wind_speed_kmh") ?? current.wind_speed_kmh, " km/h")),
        pill("Pressure", fmt(pick(current, "pressure_hpa") ?? current.pressure_hpa, " hPa")),
        `<span class="pill confidence ${conf.label || ""}">Confidence ${conf.label || "—"}</span>`,
        obs && obs.station ? `<span class="pill">SHMÚ obs ${obs.station.name} · ${fmt(obs.temperature_c, "°")}</span>` : ""
      ].join("");

      const hours = data.hourly || [];
      $("hourly").innerHTML = hours.map((hour) => `
        <div class="hour">
          <span>${hourLabel(hour.time)}</span>
          <b>${fmt(valueFor(hour, "temperature_c"), "°")}</b>
          <span>${fmt(valueFor(hour, "precipitation_probability"), "%")}</span>
        </div>`).join("") || `<p class="status">No hourly data.</p>`;

      const days = data.daily || [];
      const highs = days.map((d) => valueFor(d, "temperature_max_c")).filter((n) => n != null);
      const lows = days.map((d) => valueFor(d, "temperature_min_c")).filter((n) => n != null);
      const min = Math.min(...lows, ...highs);
      const max = Math.max(...lows, ...highs);
      const span = Math.max(1, max - min);
      $("daily").innerHTML = days.map((day) => {
        const lo = valueFor(day, "temperature_min_c");
        const hi = valueFor(day, "temperature_max_c");
        const left = lo == null ? 0 : ((lo - min) / span) * 100;
        const width = lo == null || hi == null ? 0 : Math.max(4, ((hi - lo) / span) * 100);
        return `<div class="day-row">
          <div><b>${dayLabel(day.date)}</b><div class="cond">${day.date.slice(5)}</div></div>
          <div>
            <div class="cond">${prettyCondition(valueFor(day, "condition"))} · ${fmt(valueFor(day, "precipitation_probability"), "% rain")}</div>
            <div class="bar" aria-hidden="true"><i style="left:${left}%;width:${width}%"></i></div>
          </div>
          <div class="temps"><em>${fmt(lo, "°")}</em>${fmt(hi, "°")}</div>
        </div>`;
      }).join("") || `<p class="status">No daily data.</p>`;

      renderSources();
      renderChart();
    }

    function valueFor(block, field) {
      if (state.source === "ensemble") {
        return block.ensemble && block.ensemble[field] != null ? block.ensemble[field] : block[field];
      }
      const src = (block.sources || {})[state.source];
      return src ? src[field] : null;
    }

    function pill(label, value) {
      return `<span class="pill">${label} ${value}</span>`;
    }

    function renderSources() {
      const data = state.forecast;
      const ids = ["ensemble"].concat((data.sources || []).filter((s) => s.status === "ok").map((s) => s.id));
      const weightRows = (((data.weights || {}).variables || {}).temperature_max) || {};
      $("sources").innerHTML = ids.map((id) => {
        const pressed = state.source === id;
        const row = weightRows[id];
        let label = id === "ensemble" ? "Ensemble" : id;
        if (row && row.weight != null && id !== "ensemble") {
          label += ` ${Math.round(row.weight * 100)}%`;
        }
        return `<button class="chip" type="button" data-source="${id}" aria-pressed="${pressed}">${label}</button>`;
      }).join("");
      $("sources").querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.source = btn.dataset.source;
          render();
        });
      });
      const reading = state.source === "ensemble" ? null : ((data.current || {}).sources || {})[state.source];
      const model = reading && reading.model ? ` · ${reading.model}` : "";
      const scheme = (data.weights || {}).scheme;
      const schemeText = scheme === "inverse_mae"
        ? "Ensemble weights are inverse MAE against SHMÚ station observations. A source without enough history keeps an equal share."
        : "Not enough SHMÚ history for this lead, so the ensemble is using equal weights.";
      $("source-note").textContent = state.source === "ensemble"
        ? schemeText
        : `Showing ${state.source} only${model}.`;
    }

    function renderChart() {
      const canvas = $("chart");
      if (!window.Chart) return;
      const hours = (state.forecast.hourly || []);
      const labels = hours.map((h) => hourLabel(h.time));
      const ensemble = hours.map((h) => h.ensemble ? h.ensemble.temperature_c : h.temperature_c);
      const datasets = [{
        label: "Ensemble",
        data: ensemble,
        borderColor: "#8ee7ff",
        backgroundColor: "rgba(142,231,255,0.15)",
        fill: true,
        tension: 0.35,
        pointRadius: 0,
        borderWidth: 2
      }];
      if (state.source !== "ensemble") {
        datasets.push({
          label: state.source,
          data: hours.map((h) => (h.sources && h.sources[state.source] ? h.sources[state.source].temperature_c : null)),
          borderColor: "#ffb086",
          tension: 0.35,
          pointRadius: 0,
          borderWidth: 2
        });
      }
      if (state.chart) state.chart.destroy();
      state.chart = new Chart(canvas, {
        type: "line",
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#93a4b5" } } },
          scales: {
            x: { ticks: { color: "#93a4b5", maxTicksLimit: 8 }, grid: { display: false } },
            y: { ticks: { color: "#93a4b5" }, grid: { color: "rgba(255,255,255,0.06)" } }
          }
        }
      });
    }

    async function searchPlaces(q) {
      const box = $("suggest");
      if (!q || q.length < 2) { box.classList.add("hidden"); return; }
      const response = await fetch(`/api/v1/geocode?q=${encodeURIComponent(q)}`);
      const body = await response.json();
      state.suggest = body.results || [];
      if (!state.suggest.length) { box.classList.add("hidden"); return; }
      box.innerHTML = state.suggest.map((place, i) => `
        <button type="button" data-i="${i}" role="option">
          ${place.name}<br><small>${[place.admin1, place.country].filter(Boolean).join(", ")}</small>
        </button>`).join("");
      box.classList.remove("hidden");
      box.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const place = state.suggest[Number(btn.dataset.i)];
          box.classList.add("hidden");
          $("q").value = place.name;
          loadForecast({ lat: place.lat, lon: place.lon });
        });
      });
    }

    $("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const q = $("q").value.trim();
      if (state.suggest.length) {
        const place = state.suggest[0];
        $("suggest").classList.add("hidden");
        loadForecast({ lat: place.lat, lon: place.lon });
        return;
      }
      if (q) loadForecast({ place: q });
    });

    let timer = 0;
    $("q").addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => searchPlaces($("q").value.trim()), 250);
    });

    $("geo").addEventListener("click", () => {
      if (!navigator.geolocation) {
        $("banner").textContent = "This browser has no location service.";
        return;
      }
      $("banner").textContent = "Finding your location…";
      navigator.geolocation.getCurrentPosition(
        (pos) => loadForecast({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        () => { $("banner").textContent = "Location permission was denied."; },
        { enableHighAccuracy: false, timeout: 8000 }
      );
    });

    async function loadAccuracy() {
      try {
        const response = await fetch("/api/v1/accuracy");
        if (!response.ok) return;
        const report = await response.json();
        const validated = report.shmu_validated_daily && report.shmu_validated_daily.test;
        const test = validated || report.test || {};
        const rows = Object.entries(test).map(([name, scores]) => {
          const temp = (scores.temperature_max_c || {});
          const precip = scores.precipitation || {};
          return `<tr><td>${name}</td><td>${temp.mae ?? "—"}</td><td>${temp.rmse ?? "—"}</td><td>${precip.brier ?? "—"}</td><td>${precip.hit_rate ?? "—"}</td><td>${temp.n ?? precip.n ?? "—"}</td></tr>`;
        }).join("");
        const window = (validated && report.shmu_validated_daily.test_window) || report.test_window || {};
        const caption = validated
          ? `Held-out ${window.start || ""} to ${window.end || ""} against validated SHMÚ daily climate at Bratislava-Koliba. Temperature uses the 21:00–21:00 local window. Precipitation event ≥ 1 mm on days with a reported total.`
          : `Held-out ${window.start || ""} to ${window.end || ""}, daily maximum temperature in °C. Precipitation event ≥ 1 mm.`;
        $("accuracy").innerHTML = `
          <p class="status">${caption} Lower MAE, RMSE and Brier are better.</p>
          <table>
            <thead><tr><th>Source</th><th>MAE</th><th>RMSE</th><th>Brier</th><th>Hit rate</th><th>n</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      } catch (err) { /* accuracy is optional */ }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
    loadForecast(paramsFromLocation());
    loadAccuracy();
  </script>
</body>
</html>
