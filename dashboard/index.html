      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 space-y-4 sm:space-y-6 fade-in">
          <h2 className="text-xl sm:text-2xl font-semibold tracking-tight">{city.name} — 30-Day Trends</h2>
          <p className="text-muted text-sm">{trends.dates.length} days of historical data</p>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <TrendChart
              title="Temperature Trend"
              labels={trends.dates}
              datasets={[
                { label: 'High \u00B0C', data: trends.temp_highs, borderColor: '#f97316', backgroundColor: '#f9731633' },
                { label: 'Low \u00B0C', data: trends.temp_lows, borderColor: '#3b82f6', backgroundColor: '#3b82f633' },
              ]}
              yLabel="\u00B0C"
            />
            <TrendChart
              title="Precipitation"
              labels={trends.dates}
              datasets={[
                { label: 'Precip (mm)', data: trends.precip, borderColor: '#06b6d4', backgroundColor: '#06b6d433', fill: true },
              ]}
              yLabel="mm"
              chartType="bar"
            />
            <TrendChart
              title="Barometric Pressure"
              labels={trends.dates}
              datasets={[
                { label: 'Pressure (hPa)', data: trends.pressure, borderColor: '#a78bfa', backgroundColor: '#a78bfa33' },
              ]}
              yLabel="hPa"
            />
            <TrendChart
              title="Humidity"
              labels={trends.dates}
              datasets={[
                { label: 'Humidity (%)', data: trends.humidity, borderColor: '#34d399', backgroundColor: '#34d39933', fill: true },
              ]}
              yLabel="%"
            />
          </div>

          {/* Source error trends -- Pro mode only */}
          {proMode && Object.keys(trends.source_errors || {}).length > 0 && (
            <div className="border border-base-border p-5" style={{borderRadius:'4px'}}>
              <h3 className="text-xs text-muted uppercase tracking-widest mb-4">Source Accuracy Over Time</h3>
              <SourceErrorChart sourceErrors={trends.source_errors} />
            </div>
          )}
        </div>
      );
    }

    function TrendChart({ title, labels, datasets, yLabel, chartType = 'line' }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        if (chartRef.current) chartRef.current.destroy();

        const shortLabels = labels.map(d => {
          const dt = new Date(d + 'T00:00');
          return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        });

        chartRef.current = new Chart(canvasRef.current, {
          type: chartType,
          data: {
            labels: shortLabels,
            datasets: datasets.map(ds => ({
              ...ds,
              tension: 0.3,
              borderWidth: 2,
              pointRadius: 2,
              pointHoverRadius: 5,
            }))
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              title: { display: true, text: title, color: '#e8e4df', font: { size: 14 } },
              legend: { labels: { color: '#8a8697', font: { size: 11 } } },
            },
            scales: {
              x: { ticks: { color: '#8a8697', maxRotation: 45, font: { size: 10 } }, grid: { color: '#2a2a45' } },
              y: { ticks: { color: '#8a8697' }, grid: { color: '#2a2a45' }, title: { display: true, text: yLabel, color: '#8a8697' } },
            }
          }
        });
        setReady(true);
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [labels, datasets, title, yLabel, chartType]);

      return (
        <div className="border border-base-border p-5" style={{borderRadius:'4px'}}>
          <div className="chart-container relative">
            {!ready && <div className="absolute inset-0 rounded-lg chart-shimmer" />}
            <canvas ref={canvasRef} role="img" aria-label={`${title} chart showing ${datasets.map(d => d.label).join(' and ')}`} />
          </div>
        </div>
      );
    }

    function SourceErrorChart({ sourceErrors }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (chartRef.current) chartRef.current.destroy();
        const colors = { 'Open-Meteo': '#3b82f6', 'wttr.in': '#10b981', 'OpenWeatherMap': '#f59e0b', 'WeatherAPI': '#ef4444', 'NOAA_NWS': '#06b6d4', 'VisualCrossing': '#a855f7', 'ECMWF': '#f97316' };

        const allDates = [...new Set(Object.values(sourceErrors).flat().map(e => e.date))].sort();
        const shortLabels = allDates.map(d => new Date(d + 'T00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));

        const alignedDatasets = Object.entries(sourceErrors).map(([source, errors]) => {
          const errorMap = Object.fromEntries(errors.map(e => [e.date, e.error]));
          return {
            label: source,
            data: allDates.map(d => errorMap[d] ?? null),
            borderColor: colors[source] || '#94a3b8',
            backgroundColor: (colors[source] || '#94a3b8') + '33',
            tension: 0.3, borderWidth: 2, pointRadius: 3, spanGaps: true,
          };
        });

        chartRef.current = new Chart(canvasRef.current, {
          type: 'line',
          data: { labels: shortLabels, datasets: alignedDatasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#8a8697' } },
            },
            scales: {
              x: { ticks: { color: '#8a8697', maxRotation: 45, font: { size: 10 } }, grid: { color: '#2a2a45' } },
              y: { ticks: { color: '#8a8697' }, grid: { color: '#2a2a45' }, title: { display: true, text: 'Error (\u00B0C)', color: '#8a8697' }, beginAtZero: true },
            }
          }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [sourceErrors]);

      return <div className="chart-container"><canvas ref={canvasRef} role="img" aria-label="Source prediction error tracking over time" /></div>;
    }

    // =====================================================================
    // MODEL SKILL VIEW (Council Round 3 Marcus sign-off panel)
    // =====================================================================
    const SKILL_VARS = [
      { key: 'temp_c', label: 'Temperature', unit: '\u00B0C', color: '#f59e0b' },
      { key: 'humidity_pct', label: 'Humidity', unit: '%', color: '#10b981' },
      { key: 'wind_speed_kmh', label: 'Wind speed', unit: 'km/h', color: '#38bdf8' },
      { key: 'precip_mm', label: 'Precipitation', unit: 'mm', color: '#a78bfa' },
    ];

    function SkillCRPSChart({ rows, variable, color }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current || !rows || !rows.length) return;
        // Aggregate by date (mean across cities)
        const byDate = new Map();
        for (const r of rows) {
          if (r.variable !== variable || r.crps == null) continue;
          if (!byDate.has(r.verify_date)) byDate.set(r.verify_date, { sum: 0, n: 0, cov: 0 });
          const e = byDate.get(r.verify_date);
          e.sum += r.crps; e.n += 1;
          e.cov += (r.cov80 || 0);
        }
        const dates = Array.from(byDate.keys()).sort();
        const crps = dates.map(d => byDate.get(d).sum / byDate.get(d).n);
        const cov = dates.map(d => byDate.get(d).cov / byDate.get(d).n);
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current, {
          type: 'line',
          data: {
            labels: dates,
            datasets: [
              { label: 'CRPS (lower=better)', data: crps, borderColor: color, backgroundColor: color + '22', yAxisID: 'y', tension: 0.25, borderWidth: 2, pointRadius: 3 },
              { label: 'cov80 (target 0.80)', data: cov, borderColor: '#94a3b8', backgroundColor: '#94a3b820', yAxisID: 'y1', borderDash: [4,4], tension: 0.25, borderWidth: 1.5, pointRadius: 2 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#cbd5e1', font: { size: 11 } } }, tooltip: { mode: 'index', intersect: false } },
            scales: {
              x: { ticks: { color: '#94a3b8', font: { size: 10 }, maxRotation: 0 }, grid: { color: '#334155' } },
              y: { position: 'left', ticks: { color: color, font: { size: 10 } }, grid: { color: '#334155' }, title: { display: true, text: 'CRPS', color: color, font: { size: 10 } } },
              y1: { position: 'right', min: 0, max: 1, ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { drawOnChartArea: false }, title: { display: true, text: 'cov80', color: '#94a3b8', font: { size: 10 } } },
            },
          },
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [rows, variable, color]);
      return <div className="chart-container" style={{height:'200px'}}><canvas ref={canvasRef} role="img" aria-label={`${variable} CRPS trend`} /></div>;
    }

    function Cov80Gauge({ value, target = 0.8 }) {
      const v = value || 0;
      const err = Math.abs(v - target);
      const color = err < 0.03 ? '#10b981' : err < 0.08 ? '#f59e0b' : '#ef4444';
      const pct = Math.min(100, v * 100);
      return (
        <div className="flex flex-col items-center">
          <div style={{width:80, height:80, position:'relative'}}>
            <svg viewBox="0 0 100 100" style={{transform:'rotate(-90deg)'}}>
              <circle cx="50" cy="50" r="40" fill="none" stroke="#334155" strokeWidth="8" />
              <circle cx="50" cy="50" r="40" fill="none" stroke={color} strokeWidth="8"
                strokeDasharray={`${(pct/100)*251.3} 251.3`} strokeLinecap="round" />
              <circle cx="50" cy="50" r="40" fill="none" stroke="#d4a853" strokeWidth="1"
                strokeDasharray={`${(target)*251.3} 251.3`} strokeDashoffset="0" opacity="0.6" />
            </svg>
            <div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column'}}>
              <span className="text-base font-mono font-bold" style={{color}}>{(v*100).toFixed(1)}%</span>
              <span className="text-[9px] text-muted">/ 80%</span>
            </div>
          </div>
        </div>
      );
    }

    function SkillView() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [err, setErr] = useState(null);
      const [days, setDays] = useState(30);

      useEffect(() => {
        setLoading(true);
        api.getMosSkill(days).then(d => { setData(d); setErr(null); }).catch(e => setErr(String(e))).finally(() => setLoading(false));
      }, [days]);

      if (loading) return <div className="p-6 text-muted">Loading model skill panel…</div>;
      if (err) return <div className="p-6 text-rose-400">Failed to load: {err}</div>;
      if (!data || !data.rows || data.rows.length === 0) {
        return <div className="p-6 text-muted">
          No <code>mos_daily_skill</code> rows yet. The daily verify cron at 06:00 UTC writes one row per (city × variable × day); come back after at least one cycle.
        </div>;
      }

      const summary = data.summary_by_variable || {};
      const nDays = Math.max(...Object.values(summary).map(s => s.n_days || 0), 0);
      const dataConfidence = nDays < 7 ? 'very low' : nDays < 14 ? 'low' : nDays < 30 ? 'moderate' : 'high';
      const confColor = nDays < 7 ? 'text-rose-400' : nDays < 14 ? 'text-amber-400' : nDays < 30 ? 'text-yellow-400' : 'text-emerald-400';

      return (
        <div className="p-4 sm:p-6 max-w-7xl mx-auto">
          <div className="flex items-start justify-between mb-4 gap-3 flex-wrap">
            <div>
              <h2 className="text-lg font-semibold text-muted-light">Model skill (MOS shadow verify)</h2>
              <p className="text-xs text-muted mt-1">
                Operational telemetry from the daily shadow verify cron. Council Round 3 Marcus sign-off panel.
                {' '}Data confidence: <span className={`font-semibold ${confColor}`}>{dataConfidence}</span> ({nDays} days, {data.distinct_cities.length} cities)
              </p>
            </div>
            <div className="flex items-center gap-2 text-xs">
              <span className="text-muted">Window:</span>
              {[7, 14, 30, 60, 90].map(d => (
                <button key={d} onClick={() => setDays(d)}
                  className={`px-2 py-1 border ${days === d ? 'bg-gold text-base-bg border-gold' : 'border-base-border text-muted hover:text-muted-light'}`}
                  style={{borderRadius: '3px'}}>
                  {d}d
                </button>
              ))}
            </div>
          </div>

          {/* Summary table */}
          <div className="mb-6 border border-base-border" style={{borderRadius:'4px', overflow:'hidden'}}>
            <table className="w-full text-xs">
              <thead className="bg-base-hover text-muted">
                <tr>
                  <th className="px-3 py-2 text-left">Variable</th>
                  <th className="px-3 py-2 text-right">CRPS</th>
                  <th className="px-3 py-2 text-right">cov80</th>
                  <th className="px-3 py-2 text-right">MAE</th>
                  <th className="px-3 py-2 text-right">ensemble MAE</th>
                  <th className="px-3 py-2 text-right">Δ vs ens</th>
                  <th className="px-3 py-2 text-right">rows</th>
                </tr>
              </thead>
              <tbody className="text-muted-light font-mono">
                {SKILL_VARS.map(v => {
                  const s = summary[v.key];
                  if (!s) return null;
                  const deltaVsEns = s.ensemble_mae ? ((s.mae - s.ensemble_mae) / s.ensemble_mae * 100) : null;
                  const covOk = Math.abs((s.cov80 || 0) - 0.8) < 0.05;
                  return (
                    <tr key={v.key} className="border-t border-base-border">
                      <td className="px-3 py-2 text-left" style={{color: v.color}}>{v.label}</td>
                      <td className="px-3 py-2 text-right">{s.crps?.toFixed(4) ?? '—'}</td>
                      <td className={`px-3 py-2 text-right ${covOk ? 'text-emerald-400' : 'text-amber-400'}`}>{s.cov80?.toFixed(3) ?? '—'}</td>
                      <td className="px-3 py-2 text-right">{s.mae?.toFixed(3) ?? '—'}</td>
                      <td className="px-3 py-2 text-right text-muted-dim">{s.ensemble_mae?.toFixed(3) ?? '—'}</td>
                      <td className={`px-3 py-2 text-right ${deltaVsEns != null && deltaVsEns < 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {deltaVsEns != null ? `${deltaVsEns.toFixed(1)}%` : '—'}
                      </td>
                      <td className="px-3 py-2 text-right text-muted-dim">{s.n_rows}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Coverage gauges */}
          <div className="mb-6">
            <div className="text-xs text-muted mb-2">80% interval coverage (target: 80%)</div>
            <div className="flex flex-wrap gap-6 justify-center sm:justify-start">
              {SKILL_VARS.map(v => {
                const s = summary[v.key];
                if (!s) return null;
                return (
                  <div key={v.key} className="flex flex-col items-center">
                    <Cov80Gauge value={s.cov80} />
                    <div className="text-[10px] text-muted mt-1" style={{color: v.color}}>{v.label}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Per-variable CRPS trends */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {SKILL_VARS.map(v => {
              const s = summary[v.key];
              if (!s) return null;
              return (
                <div key={v.key} className="border border-base-border p-3" style={{borderRadius:'4px'}}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-semibold" style={{color: v.color}}>{v.label}</span>
                    <span className="text-[10px] text-muted-dim font-mono">{s.n_days}d / {s.n_rows}rows</span>
                  </div>
                  <SkillCRPSChart rows={data.rows} variable={v.key} color={v.color} />
                </div>
              );
            })}
          </div>

          <p className="text-[10px] text-muted-dim mt-6">
            CRPS proxy = 2 × mean(pinball loss at τ=0.1, 0.5, 0.9). Computed daily by <code>mos_shadow_verify.py</code>.
            Calibrated isotonic recalibration (temp_c, humidity_pct, wind_speed_kmh) lands in this panel starting with the first verify cycle after 2026-04-13 21:42 UTC.
          </p>
        </div>
      );
    }

    // =====================================================================
    // SEASONAL VIEW
    // =====================================================================
    const phaseColor = {
      strong_el_nino: 'text-red-400', moderate_el_nino: 'text-orange-400', weak_el_nino: 'text-yellow-400',
      strong_la_nina: 'text-blue-400', moderate_la_nina: 'text-blue-300', weak_la_nina: 'text-teal-400',
      neutral: 'text-muted', positive: 'text-emerald-400', negative: 'text-rose-400',
      warm: 'text-orange-400', cool: 'text-blue-400',
      westerly: 'text-green-400', easterly: 'text-amber-400', unknown: 'text-muted-dim',
    };
    const phaseBg = {
      strong_el_nino: 'bg-red-500/15 border-red-500/30', moderate_el_nino: 'bg-orange-500/15 border-orange-500/30',
      weak_el_nino: 'bg-yellow-500/15 border-yellow-500/30',
      strong_la_nina: 'bg-blue-500/15 border-blue-500/30', moderate_la_nina: 'bg-cyan-500/15 border-cyan-500/30',
      weak_la_nina: 'bg-teal-500/15 border-teal-500/30',
      neutral: 'bg-base-hover border-base-border', positive: 'bg-emerald-500/15 border-emerald-500/30',
      negative: 'bg-rose-500/15 border-rose-500/30',
      warm: 'bg-orange-500/15 border-orange-500/30', cool: 'bg-blue-500/15 border-blue-500/30',
      westerly: 'bg-green-500/15 border-green-500/30', easterly: 'bg-amber-500/15 border-amber-500/30',
      unknown: 'bg-base-card border-base-border',
    };

    const indexLabels = {
      oni: 'ENSO (ONI)', nao: 'NAO', ao: 'Arctic Osc.', pdo: 'PDO', amo: 'AMO',
      pna: 'PNA', soi: 'SOI', qbo: 'QBO', dmi: 'IOD (DMI)', ea: 'East Atlantic',
      scand: 'Scandinavian', wp: 'West Pacific',
      tnh: 'Trop/NH', tna: 'Trop N. Atlantic', tsa: 'Trop S. Atlantic',
      nino34: 'Nino 3.4', np: 'N. Pacific', aao: 'Antarctic Osc.',
    };

    const monthNames = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // Helper to generate ENSO narrative text
    const ensoNarrative = (oni) => {
      if (!oni) return null;
      const val = oni.value;
      const phase = oni.phase || '';
      if (val > 0.5) {
        return `El Ni\u00F1o is active (ONI: ${val >= 0 ? '+' : ''}${val.toFixed(2)}). This typically means warmer and wetter conditions for many regions.`;
      } else if (val < -0.5) {
        return `La Ni\u00F1a is active (ONI: ${val.toFixed(2)}). This typically means cooler and drier conditions for many regions.`;
      }
      return `ENSO is in a neutral phase (ONI: ${val >= 0 ? '+' : ''}${val.toFixed(2)}). No strong El Ni\u00F1o or La Ni\u00F1a influence expected.`;
    };

    const indexNarrative = (name, info) => {
      if (!info) return null;
      const val = info.value;
      const phase = (info.phase || '').replace(/_/g, ' ');
      if (name === 'nao') {
        if (Math.abs(val) < 0.5) return null;
        return val > 0
          ? `NAO is positive (${val >= 0 ? '+' : ''}${val.toFixed(2)}). Expect milder, wetter conditions in Northern Europe.`
          : `NAO is negative (${val.toFixed(2)}). Expect colder continental conditions in Europe.`;
      }
      if (name === 'ao') {
        if (Math.abs(val) < 0.5) return null;
        return val > 0
          ? `Arctic Oscillation is positive (${val >= 0 ? '+' : ''}${val.toFixed(2)}). Polar vortex is strong, keeping cold air at high latitudes.`
          : `Arctic Oscillation is negative (${val.toFixed(2)}). Polar vortex is weak, increasing risk of cold air outbreaks.`;
      }
      return null;
    };

    const tercileText = (tp) => {
      if (!tp) return 'Near normal';
      const bn = tp.below_normal || 0.333;
      const nn = tp.near_normal || 0.334;
      const an = tp.above_normal || 0.333;
      if (an > bn && an > nn) return 'Likely warmer';
      if (bn > an && bn > nn) return 'Likely cooler';
      return 'Near normal';
    };

    const precipTercileText = (precip) => {
      if (precip == null) return 'Near normal';
      if (precip > 10) return 'Wetter';
      if (precip < -10) return 'Drier';
      return 'Near normal';
    };

    function SeasonalView({ city, proMode, learnMode }) {
      const [data, setData] = useState(null);
      const [indices, setIndices] = useState(null);
      const [loading, setLoading] = useState(true);
      const [months, setMonths] = useState(3);
      const [error, setError] = useState(null);

      const loadData = useCallback((m) => {
        setLoading(true);
        setError(null);
        Promise.all([
          api.getSeasonal(city.id, m),
          api.getIndices(),
        ]).then(([s, idx]) => {
          if (s.error) { setError(s.error); setLoading(false); return; }
          setData(s);
          setIndices(idx.indices || {});
          setLoading(false);
        }).catch(err => { setError(err.message); setLoading(false); });
      }, [city.id]);

      useEffect(() => { loadData(months); }, [city.id, months, loadData]);

      if (loading) return (
        <div className="flex flex-col items-center justify-center h-96 gap-4">
          <div className="animate-spin w-8 h-8 border-2 border-gold border-t-transparent rounded-full"></div>
          <div className="text-muted">Loading seasonal outlook... This may take a moment on first run.</div>
        </div>
      );
      if (error) return (
        <div className="p-8 flex flex-col items-center gap-4" role="alert">
          <span className="text-4xl">{'\u26A0\uFE0F'}</span>
          <span className="text-red-400 text-lg font-semibold">Seasonal Forecast Error</span>
          <span className="text-muted text-sm text-center max-w-md">{error}</span>
          <button onClick={() => loadData(months)} className="bg-gold hover:bg-gold-dim text-base-bg px-5 py-2 rounded-lg text-sm font-medium transition">
            Retry
          </button>
        </div>
      );
      if (!data) return <div className="p-8 text-muted">No seasonal data available</div>;

      const forecasts = data.monthly_forecasts || [];
      const idxState = data.index_state || indices || {};
      const tier1 = ['oni', 'nao', 'ao', 'pdo', 'amo', 'pna', 'soi'];
      const tier2 = ['qbo', 'dmi', 'ea', 'eawr', 'scand', 'wp', 'epnp', 'tnh'];

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 space-y-4 sm:space-y-6 fade-in">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
              <h2 className="text-2xl sm:text-3xl font-semibold tracking-tight">Seasonal Outlook</h2>
              <p className="text-muted">{city.name}, {city.country}</p>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-sm text-muted hidden sm:inline">Horizon:</span>
              {[3, 6, 12].map(m => (
                <button key={m} onClick={() => setMonths(m)}
                  className={`px-3 py-1.5 text-sm font-medium transition ${months === m ? 'bg-sage text-base-bg' : 'bg-base-hover text-muted-light hover:bg-base-border'}`} style={{borderRadius:'4px'}}>
                  {m}mo
                </button>
              ))}
            </div>
          </div>

          {/* SIMPLE MODE: Narrative climate index cards */}
          {!proMode && (
            <div className="space-y-3">
              {idxState.oni && (
                <div className={`border border-base-border p-4 ${phaseBg[idxState.oni.phase] || phaseBg.unknown}`}>
                  <div className="flex items-start gap-3">
                    <span className="text-2xl">{idxState.oni.value > 0.5 ? '\uD83C\uDF21\uFE0F' : idxState.oni.value < -0.5 ? '\u2744\uFE0F' : '\u2696\uFE0F'}</span>
                    <div>
                      <div className="font-semibold text-sm mb-1">ENSO Status</div>
                      <div className="text-sm text-muted-light">{ensoNarrative(idxState.oni)}</div>
                    </div>
                  </div>
                </div>
              )}
              {indexNarrative('nao', idxState.nao) && (
                <div className={`border border-base-border p-4 ${phaseBg[idxState.nao?.phase] || phaseBg.unknown}`}>
                  <div className="flex items-start gap-3">
                    <span className="text-2xl">{'\uD83C\uDF0A'}</span>
                    <div>
                      <div className="font-semibold text-sm mb-1">North Atlantic Oscillation</div>
                      <div className="text-sm text-muted-light">{indexNarrative('nao', idxState.nao)}</div>
                    </div>
                  </div>
                </div>
              )}
              {indexNarrative('ao', idxState.ao) && (
                <div className={`border border-base-border p-4 ${phaseBg[idxState.ao?.phase] || phaseBg.unknown}`}>
                  <div className="flex items-start gap-3">
                    <span className="text-2xl">{'\u2744\uFE0F'}</span>
                    <div>
                      <div className="font-semibold text-sm mb-1">Arctic Oscillation</div>
                      <div className="text-sm text-muted-light">{indexNarrative('ao', idxState.ao)}</div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* PRO MODE: Full index cards */}
          {proMode && (
            <>
              <div>
                <h3 className="font-semibold text-sm text-muted uppercase tracking-wide mb-3">Core Climate Indices</h3>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3">
                  {tier1.map(name => {
                    const info = idxState[name];
                    if (!info) return null;
                    const phase = info.phase || 'unknown';
                    return (
                      <LearnTip key={name} id={name} learnMode={learnMode}>
                        <div className={`rounded p-3 border ${phaseBg[phase] || phaseBg.unknown}`}>
                          <div className="text-xs text-muted mb-1">{indexLabels[name] || name.toUpperCase()}</div>
                          <div className={`text-lg font-bold ${phaseColor[phase] || phaseColor.unknown}`}>
                            {info.value >= 0 ? '+' : ''}{info.value.toFixed(2)}
                          </div>
                          <div className="text-xs text-muted-dim mt-1 capitalize">{phase.replace(/_/g, ' ')}</div>
                        </div>
                      </LearnTip>
                    );
                  })}
                </div>
              </div>

              {/* Tier 2 indices */}
              <details className="group">
                <summary className="cursor-pointer text-sm text-muted hover:text-muted-light transition">
                  {'\u25B6'} Regional & Specialized Indices ({Object.keys(idxState).filter(k => tier2.includes(k)).length} available)
                </summary>
                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-4 lg:grid-cols-8 gap-2 mt-3">
                  {tier2.map(name => {
                    const info = idxState[name];
                    if (!info) return null;
                    const phase = info.phase || 'unknown';
                    return (
                      <LearnTip key={name} id={name} learnMode={learnMode}>
                        <div className={`rounded-lg p-2 border ${phaseBg[phase] || phaseBg.unknown}`}>
                          <div className="text-[10px] text-muted-dim">{indexLabels[name] || name.toUpperCase()}</div>
                          <div className={`text-sm font-bold ${phaseColor[phase] || phaseColor.unknown}`}>
                            {info.value >= 0 ? '+' : ''}{info.value.toFixed(2)}
                          </div>
                        </div>
                      </LearnTip>
                    );
                  })}
                </div>
              </details>
            </>
          )}

          {/* Monthly Outlook Table */}
          <div>
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-xs text-muted uppercase tracking-widest">Monthly Outlook</h3>
              <span className="text-xs text-muted-dim font-mono">{months}mo</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-muted text-xs uppercase">
                    <th className="px-5 py-3 text-left">Month</th>
                    {proMode ? (
                      <>
                        <th className="px-3 py-3 text-right"><LearnTip id="temp_anomaly" learnMode={learnMode}>Temp Anomaly</LearnTip></th>
                        <th className="px-3 py-3 text-right"><LearnTip id="precip_anomaly" learnMode={learnMode}>Precip Anomaly</LearnTip></th>
                        <th className="px-3 py-3 text-center"><LearnTip id="seasonal_confidence" learnMode={learnMode}>Confidence</LearnTip></th>
                        <th className="px-5 py-3 text-left"><LearnTip id="tercile_probs" learnMode={learnMode}>Tercile Probability</LearnTip></th>
                      </>
                    ) : (
                      <>
                        <th className="px-3 py-3 text-center">Temperature Outlook</th>
                        <th className="px-3 py-3 text-center">Rainfall</th>
                        <th className="px-3 py-3 text-center">Confidence</th>
                      </>
                    )}
                  </tr>
                </thead>
                <tbody>
                  {forecasts.map((fc, i) => {
                    const temp = fc.temp_anomaly_c;
                    const precip = fc.precip_anomaly_pct;
                    const conf = fc.confidence;
                    const tp = fc.tercile_probs || {};
                    const bn = (tp.below_normal || 0.333) * 100;
                    const nn = (tp.near_normal || 0.334) * 100;
                    const an = (tp.above_normal || 0.333) * 100;
                    const confLabel = conf >= 0.6 ? 'HIGH' : conf >= 0.3 ? 'MODERATE' : 'LOW';
                    const confCls = conf >= 0.6 ? 'text-emerald-400' : conf >= 0.3 ? 'text-yellow-400' : 'text-red-400';

                    if (proMode) {
                      return (
                        <tr key={i} className="border-t border-base-border/50">
                          <td className="px-5 py-3 font-medium">
                            {monthNames[fc.target_month]} {fc.target_year}
                          </td>
                          <td className={`px-3 py-3 text-right font-bold ${temp != null ? (temp > 0 ? 'text-orange-400' : temp < 0 ? 'text-blue-400' : 'text-muted-light') : 'text-muted-dim'}`}>
                            {temp != null ? `${temp > 0 ? '+' : ''}${temp.toFixed(1)}\u00B0C` : 'N/A'}
                          </td>
                          <td className={`px-3 py-3 text-right font-medium ${precip != null ? (precip > 0 ? 'text-blue-300' : precip < 0 ? 'text-amber-400' : 'text-muted-light') : 'text-muted-dim'}`}>
                            {precip != null ? `${precip > 0 ? '+' : ''}${precip.toFixed(0)}%` : 'N/A'}
                          </td>
                          <td className={`px-3 py-3 text-center text-xs font-semibold ${confCls}`}>
                            {confLabel}
                          </td>
                          <td className="px-5 py-3">
                            <div className="flex items-center gap-1.5">
                              <div className="flex-1 flex h-4 rounded-full overflow-hidden text-[10px] font-bold">
                                <div className="bg-blue-500/70 flex items-center justify-center text-white" style={{width: `${bn}%`}}>
                                  {bn >= 15 ? `${bn.toFixed(0)}` : ''}
                                </div>
                                <div className="bg-muted/50 flex items-center justify-center text-white" style={{width: `${nn}%`}}>
                                  {nn >= 15 ? `${nn.toFixed(0)}` : ''}
                                </div>
                                <div className="bg-red-500/70 flex items-center justify-center text-white" style={{width: `${an}%`}}>
                                  {an >= 15 ? `${an.toFixed(0)}` : ''}
                                </div>
                              </div>
                              <span className="text-[10px] text-muted-dim w-16">BN|NN|AN</span>
                            </div>
                          </td>
                        </tr>
                      );
                    }

                    // Simple mode
                    const tempOutlook = tercileText(tp);
                    const precipOutlook = precipTercileText(precip);
                    const tempColor = tempOutlook === 'Likely warmer' ? 'text-orange-400' : tempOutlook === 'Likely cooler' ? 'text-blue-400' : 'text-muted-light';
                    const precipColor = precipOutlook === 'Wetter' ? 'text-blue-300' : precipOutlook === 'Drier' ? 'text-amber-400' : 'text-muted-light';

                    return (
                      <tr key={i} className="border-t border-base-border/50">
                        <td className="px-5 py-3 font-medium">
                          {monthNames[fc.target_month]} {fc.target_year}
                        </td>
                        <td className={`px-3 py-3 text-center font-medium ${tempColor}`}>
                          {tempOutlook}
                        </td>
                        <td className={`px-3 py-3 text-center font-medium ${precipColor}`}>
                          {precipOutlook}
                        </td>
                        <td className={`px-3 py-3 text-center text-xs font-semibold ${confCls}`}>
                          {confLabel}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Method Breakdown & Analog Years -- Pro mode only */}
          {proMode && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* Method Weights */}
              {forecasts[0]?.method_weights && (
                <div className="border border-base-border p-5" style={{borderRadius:'4px'}}>
                  <h3 className="font-semibold mb-4"><LearnTip id="bma" learnMode={learnMode}>{'\u2696\uFE0F'} Method Weights (BMA)</LearnTip></h3>
                  <div className="space-y-3">
                    {Object.entries(forecasts[0].method_weights).map(([method, weight]) => (
                      <div key={method} className="flex items-center gap-3">
                        <span className="w-28 text-sm text-muted-light capitalize"><LearnTip id={method === 'ecmwf_seas5' ? 'ecmwf_seas5' : method === 'ridge_regression' ? 'ridge_regression' : method} learnMode={learnMode}>{method.replace('_', ' ')}</LearnTip></span>
                        <div className="flex-1 bg-base-hover rounded-full h-3 overflow-hidden">
                          <div className="h-full rounded-full bg-gradient-to-r from-sage-dim to-sage transition-all"
                            style={{ width: `${weight * 100}%` }} />
                        </div>
                        <span className="w-14 text-right text-sm font-mono text-muted">{(weight * 100).toFixed(1)}%</span>
                      </div>
                    ))}
                  </div>
                  {/* Individual method forecasts */}
                  {forecasts[0]?.individual_methods && (
                    <div className="mt-4 pt-4 border-t border-base-border">
                      <div className="text-xs text-muted-dim uppercase tracking-wide mb-2">Individual Predictions (Month 1)</div>
                      <div className="space-y-1.5">
                        {forecasts[0].individual_methods.filter(m => m.temp_anomaly_c != null).map(m => (
                          <div key={m.method} className="flex items-center justify-between text-sm">
                            <span className="text-muted capitalize">{m.method.replace('_', ' ')}</span>
                            <span className={m.temp_anomaly_c > 0 ? 'text-orange-400' : m.temp_anomaly_c < 0 ? 'text-blue-400' : 'text-muted-light'}>
                              {m.temp_anomaly_c > 0 ? '+' : ''}{m.temp_anomaly_c.toFixed(2)}{'\u00B0'}C
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Analog Years */}
              <div className="border border-base-border p-5" style={{borderRadius:'4px'}}>
                <h3 className="font-semibold mb-4"><LearnTip id="analog" learnMode={learnMode}>{'\uD83D\uDD0D'} Closest Analog Years</LearnTip></h3>
                {(() => {
                  const analogMethod = forecasts[0]?.individual_methods?.find(m => m.method === 'analog');
                  if (!analogMethod?.analogs?.length) return <p className="text-muted-dim text-sm">No analog data available</p>;
                  return (
                    <div className="space-y-2">
                      {analogMethod.analogs.map((a, i) => (
                        <div key={a.year} className="flex items-center gap-3">
                          <span className={`text-lg font-bold ${i === 0 ? 'text-purple-400' : 'text-muted-light'}`}>{a.year}</span>
                          <div className="flex-1 bg-base-hover rounded-full h-2 overflow-hidden">
                            <div className="h-full rounded-full bg-gradient-to-r from-sage to-sage-bright"
                              style={{ width: `${Math.max(5, 100 - a.distance * 30)}%` }} />
                          </div>
                          <LearnTip id="analog_distance" learnMode={learnMode}><span className="text-xs text-muted-dim w-20 text-right">d={a.distance.toFixed(3)}</span></LearnTip>
                        </div>
                      ))}
                      <p className="text-xs text-muted-dim mt-2">
                        {analogMethod.num_analogs_used} analogs evaluated. Lower distance = closer match to current teleconnection state.
                      </p>
                    </div>
                  );
                })()}
              </div>
            </div>
          )}

          {/* Tercile Probability Chart -- Pro mode only */}
          {proMode && forecasts.length > 0 && <SeasonalTercileChart forecasts={forecasts} />}
        </div>
      );
    }

    function SeasonalTercileChart({ forecasts }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (chartRef.current) chartRef.current.destroy();
        const labels = forecasts.map(fc => `${monthNames[fc.target_month]} ${fc.target_year}`);
        const bn = forecasts.map(fc => ((fc.tercile_probs?.below_normal || 0.333) * 100).toFixed(1));
        const nn = forecasts.map(fc => ((fc.tercile_probs?.near_normal || 0.334) * 100).toFixed(1));
        const an = forecasts.map(fc => ((fc.tercile_probs?.above_normal || 0.333) * 100).toFixed(1));

        chartRef.current = new Chart(canvasRef.current, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Below Normal', data: bn, backgroundColor: '#3b82f6aa', borderColor: '#3b82f6', borderWidth: 1 },
              { label: 'Near Normal', data: nn, backgroundColor: '#64748baa', borderColor: '#64748b', borderWidth: 1 },
              { label: 'Above Normal', data: an, backgroundColor: '#ef4444aa', borderColor: '#ef4444', borderWidth: 1 },
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              title: { display: true, text: 'Temperature Tercile Probabilities', color: '#e8e4df', font: { size: 14 } },
              legend: { labels: { color: '#8a8697', font: { size: 11 } } },
            },
            scales: {
              x: { stacked: true, ticks: { color: '#8a8697' }, grid: { color: '#2a2a45' } },
              y: { stacked: true, max: 100, ticks: { color: '#8a8697', callback: v => v + '%' }, grid: { color: '#2a2a45' },
                   title: { display: true, text: 'Probability %', color: '#8a8697' } },
            }
          }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [forecasts]);

      return (
        <div className="border border-base-border p-5" style={{borderRadius:'4px'}}>
          <div className="chart-container"><canvas ref={canvasRef} role="img" aria-label="Temperature tercile probability chart showing below normal, near normal, and above normal chances per month" /></div>
        </div>
      );
    }

    // =====================================================================
    // RENDER
    // =====================================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
